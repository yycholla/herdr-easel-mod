[package]
name = "easel-interp"
description = "Parse and interpret a declarative subset of GPUI element code"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# Lower the IR to real GPUI elements. Parsing alone does not need gpui.
render = ["dep:gpui"]

[dependencies]
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
thiserror.workspace = true
gpui = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
